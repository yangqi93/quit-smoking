version: "3.8"
name: quit-smoking

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quit-smoking-api
    restart: unless-stopped
    ports:
      - "${PORT:-8081}:8081"
    environment:
      PORT: "8081"
      ENV: ${ENV:-production}
      DB_HOST: ${DB_HOST:-127.0.0.1}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:?err}
      DB_NAME: ${DB_NAME:-quit_smoking}
      JWT_SECRET: ${JWT_SECRET:?err}
